<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reesee Puffs Demon List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Reesee Puffs Demon List</h1>
        <p>Community Project</p>
        <a href="players.html" class="small-tab">Leaderboard</a>
        <a href="submit.html" class="small-tab">Submit</a>
        <a href="about.html" class="small-tab">About</a>
        <a href="credits.html" class="small-tab">Credits</a>
        <a href="social.html" class="small-tab">Socials</a>
    </header>

<main>
    <div id="level-list"></div>
</main>
    
<script src="sheets.js"></script>
<script src="script.js"></script>


    <img
    class="bottom-gif"
    alt=""
    aria-hidden="true"
>

    <!-- Theme menu button -->
<button
    id="theme-menu-button"
    class="theme-menu-button"
    type="button"
    aria-controls="theme-drawer"
    aria-expanded="false"
>
    ☼ Themes
</button>

<!-- Dark overlay behind the drawer -->
<div id="theme-overlay" class="theme-overlay"></div>

<!-- Sliding theme drawer -->
<aside
    id="theme-drawer"
    class="theme-drawer"
    aria-label="Website themes"
    aria-hidden="true"
>
    <div class="theme-drawer-header">
        <h2>Website Themes</h2>

        <button
            id="theme-close-button"
            class="theme-close-button"
            type="button"
            aria-label="Close theme menu"
        >
            ×
        </button>
    </div>

    <p>Choose how the website looks.</p>

    <div class="theme-options">
        <button
            class="theme-option"
            type="button"
            data-theme-choice="default"
        >
            <span class="theme-preview default-preview"></span>
            <span>Default</span>
        </button>

        <button
            class="theme-option"
            type="button"
            data-theme-choice="dark"
        >
            <span class="theme-preview dark-preview"></span>
            <span>Dark</span>
        </button>
    </div>
</aside>

<script src="themes.js"></script>
    
</body>
</html>
