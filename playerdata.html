
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Stats Viewer</h1>
        <p>Player Profile</p></p>
    </header>

    <main class="player-profile-main">

        <section class="player-info-card">
            <h2 id="player-name">Loading...</h2>
            <div id="player-tags"></div>
            <p id="player-points">Loading...</p>
        </section>


        <a href="players.html" class="back-button">← Back to Players</a>

        <!-- Player's hardest level -->
        
        <section class="hardest-card">
            <div class="hardest-info">
                <h2>Hardest</h2>
                <p id="player-hardest">Loading...</p>
            </div>

            <div class="completion-info">
                <h2>List Completion</h2>
                <p id="player-completion">Loading...</p>
            </div>
        </section>


        <!-- Two-column grid of player statistics -->
        <div class="player-stats-grid">

            <section class="player-stat-card">
                <h2>Completed Levels</h2>
                <div id="completed-levels" class="player-level-list"></div>
            </section>

            <section class="player-stat-card">
                <h2>Verified Levels</h2>
                <div id="verified-levels" class="player-level-list"></div>
            </section>

            <section class="player-stat-card">
                <h2>Created Levels</h2>
                <div id="created-levels" class="player-level-list"></div>
            </section>

        </div>
    </main>

    <script src="sheets.js"></script>
    <script src="playerdata.js"></script>

    <img
    src="https://ik.imagekit.io/2p4y4oqkx/IMG_2891.gif?updatedAt=1793098614769"
    class="bottom-gif"
    alt=""
    aria-hidden="true"
>

    <button
    id="theme-menu-button"
    class="theme-menu-button"
    type="button"
    aria-controls="theme-drawer"
    aria-expanded="false"
>
    ☼ Themes
</button>

<div id="theme-overlay" class="theme-overlay"></div>

<aside
    id="theme-drawer"
    class="theme-drawer"
    aria-label="Website themes"
    aria-hidden="true"
>
    <div class="theme-drawer-header">
        <h2>Website Themes</h2>
        <button
            id="theme-close-button"
            class="theme-close-button"
            type="button"
            aria-label="Close theme menu"
        >
            ×
        </button>
    </div>

    <p>Choose how the website looks.</p>

    <div class="theme-options">
        <button class="theme-option" type="button" data-theme-choice="default">
            <span class="theme-preview default-preview"></span>
            <span>Default</span>
        </button>

        <button class="theme-option" type="button" data-theme-choice="dark">
            <span class="theme-preview dark-preview"></span>
            <span>Dark + Red</span>
        </button>
    </div>
</aside>

    <script src="themes.js"></script>
</body>
</html>
