<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Level</title>
<!-- refers to style.css for formatting -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <script src="sheets.js"></script>
    <script src="level.js"></script>
    <header>
      <!--"Loading..." is replaced with the element being loaded in "id=" -->
        <h1 id="level-name">Loading...</h1>
        <p id="level-creator">Loading...</p>
    </header>

    <main>
    <!-- Link back to the main demon list -->
    <a href="index.html" class="back-button">← Back to List</a>
        
        <div class="level-page">

            <img
            id="level-thumbnail"
            class="level-thumbnail-large"
            alt="No Thumbnail"
            >
            
            <div class="level-rank">
                Rank: <span id="level-rank">Loading...</span>
            </div>

            
            <div class="level-points">
                <span id="level-points">Loading...</span> Points
            </div>

            
            <div class="level-verifier">

                Verified by

                <span id="level-verifier"></span>

                 <span id="level-verifier-tags"></span>

            </div>

            
            <div class="level-id">
                Level ID: <span id="level-id">Loading...</span>

                <button id="copy-id-button">Copy ID</button>
            </div>

            <div class="level-ratings">

            <h2>Community Ratings</h2>

            <!-- Difficulty rating -->
            <div class="rating-row">

                <div class="rating-heading">
                <span>Difficulty</span>
                <span id="difficulty-value">Loading...</span>
                </div>

                <div
                    class="rating-bar"
                    role="progressbar"
                    aria-label="Average difficulty"
                    aria-valuemin="0"
                    aria-valuemax="10"
                    aria-valuenow="0"    
                    id="difficulty-bar"
                >
                    <div class="rating-fill" id="difficulty-fill"></div>

                    <div class="rating-text" id="difficulty-value">Difficulty: Loading...<div>
                </div>

            </div>

         <!-- Enjoyment rating -->
         <div class="rating-row">

                <div class="rating-heading">
                <span>Enjoyment</span>
                <span id="enjoyment-value">Loading...</span>
             </div>

             <div
                 class="rating-bar"
                 role="progressbar"
                 aria-label="Average enjoyment"
                 aria-valuemin="0"
                 aria-valuemax="10"
                 aria-valuenow="0"
                 id="enjoyment-bar"
            >
                <div class="rating-fill" id="enjoyment-fill"></div>    

                <div class="rating-text" id="enjoyment-value">Enjoyment: Loading...<div>
            </div>

        </div>

    </div>

            <div class="level-notes">

            <h2>Verifier Notes</h2>

            <p id="level-notes">Loading...</p>

            </div>

            <div class="victors">

            <h2>Victors</h2>

            <div id="victor-list"></div>

        </div>

            
        </div>

    </main>

    

</body>

</html>
