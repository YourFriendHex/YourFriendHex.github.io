<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Level</title>
<!-- refers to style.css for formatting -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <script src="sheets.js"></script>
    <script src="level.js"></script>
    <header>
      <!--"Loading..." is replaced with the element being loaded in "id=" -->
        <h1 id="level-name">Loading...</h1>
        <p id="level-creator">Loading...</p>
    </header>

    <main>
    <!-- Link back to the main demon list -->
    <a href="index.html" class="back-button">← Back to List</a>
        
        <div class="level-page">

            <div class="level-overview">

    <!-- Level thumbnail -->
    <img
        id="level-thumbnail"
        class="level-thumbnail-large"
        alt="Level thumbnail"
    >

    <!-- Level information -->
    <div class="level-info-panel">

        <div class="level-info-item">
            <span class="level-info-label">Rank</span>
            <strong id="level-rank">Loading...</strong>
        </div>

        <div class="level-info-item">
            <span class="level-info-label">Points</span>
            <strong id="level-points">Loading...</strong>
        </div>

        <div class="level-info-item">
            <span class="level-info-label">Awarded</span>

            <div id="awarded-points-stars"
                 class="awarded-points-stars">
                Loading...
            </div>

            <span id="awarded-points-value"></span>
        </div>

        <div class="level-info-item">
            <span class="level-info-label">Verified by</span>

            <strong id="level-verifier">Loading...</strong>
        </div>

        <div class="level-info-item level-info-wide">
            <span class="level-info-label">Level ID</span>

            <div class="level-id-content">
                <strong id="level-id">Loading...</strong>
                <button id="copy-id-button">Copy ID</button>
            </div>
        </div>

    </div>

</div>
            
<div class="level-stats-grid">

    <!-- Community ratings box -->
    <section class="level-detail-card level-ratings">
        <h2>Community Ratings</h2>

        <div class="rating-row">
            <div class="rating-heading">
                <span id="gameplay-value">Loading...</span>
            </div>

            <div
                class="rating-bar"
                role="progressbar"
                aria-label="Average gameplay"
                aria-valuemin="0"
                aria-valuemax="10"
                aria-valuenow="0"
                id="gameplay-bar"
            >
                <div class="rating-fill" id="gameplay-fill"></div>
                <div class="rating-text"></div>
            </div>
        </div>

        <div class="rating-row">
            <div class="rating-heading">
                <span id="enjoyment-value">Loading...</span>
            </div>

            <div
                class="rating-bar"
                role="progressbar"
                aria-label="Average enjoyment"
                aria-valuemin="0"
                aria-valuemax="10"
                aria-valuenow="0"
                id="enjoyment-bar"
            >
                <div class="rating-fill" id="enjoyment-fill"></div>
                <div class="rating-text"></div>
            </div>
        </div>
    </section>

    <!-- Verifier notes box -->
    <section class="level-detail-card level-notes">
        <h2>Notes</h2>
        <div class="level-notes-content">
            <p id="level-notes">Loading...</p>
        </div>
    </section>

    <!-- Victors box -->
    <section class="level-detail-card victors">
        <h2>Victors</h2>
        <div id="victor-list" class="victor-list"></div>
    </section>

</div>


            
        </div>

    </main>



    <script src="emoji.js"></script>
    <script src="themes.js"></script>

</body>

</html>
