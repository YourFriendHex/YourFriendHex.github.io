<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Level</title>
<!-- refers to style.css for formatting -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <script src="sheets.js"></script>
    <script src="level.js"></script>
    <header>
      <!--"Loading..." is replaced with the element being loaded in "id=" -->
        <h1 id="level-name">Loading...</h1>
        <p id="level-creator">Loading...</p>
    </header>

    <main>
    <!-- Link back to the main demon list -->
    <a href="index.html" class="back-button">← Back to List</a>
        
        <div class="level-page">

            <img
            id="level-thumbnail"
            class="level-thumbnail-large"
            alt="No Thumbnail"
            >
            
            <div class="level-rank">
                Rank: <span id="level-rank">Loading...</span>
            </div>

            
            <div class="level-points">
                <span id="level-points">Loading...</span> Points
            </div>

            
            <div class="level-verifier">

                Verified by

                <span id="level-verifier"></span>

                 <span id="level-verifier-tags"></span>

            </div>

            
            <div class="level-id">
                Level ID: <span id="level-id">Loading...</span>

                <button id="copy-id-button">Copy ID</button>
            
<div class="level-stats-grid">

    <!-- Community ratings box -->
    <section class="level-detail-card level-ratings">
        <h2>Community Ratings</h2>

        <div class="rating-row">
            <div class="rating-heading">
                <span id="difficulty-value">Loading...</span>
            </div>

            <div
                class="rating-bar"
                role="progressbar"
                aria-label="Average difficulty"
                aria-valuemin="0"
                aria-valuemax="10"
                aria-valuenow="0"
                id="difficulty-bar"
            >
                <div class="rating-fill" id="difficulty-fill"></div>
                <div class="rating-text"></div>
            </div>
        </div>

        <div class="rating-row">
            <div class="rating-heading">
                <span id="enjoyment-value">Loading...</span>
            </div>

            <div
                class="rating-bar"
                role="progressbar"
                aria-label="Average enjoyment"
                aria-valuemin="0"
                aria-valuemax="10"
                aria-valuenow="0"
                id="enjoyment-bar"
            >
                <div class="rating-fill" id="enjoyment-fill"></div>
                <div class="rating-text"></div>
            </div>
        </div>
    </section>

    <!-- Verifier notes box -->
    <section class="level-detail-card level-notes">
        <h2>Notes</h2>
        <div class="level-notes-content">
            <p id="level-notes">Loading...</p>
        </div>
    </section>

    <!-- Victors box -->
    <section class="level-detail-card victors">
        <h2>Victors</h2>
        <div id="victor-list" class="victor-list"></div>
    </section>

</div>


            
        </div>

    </main>

    <img
    src="https://ik.imagekit.io/2p4y4oqkx/IMG_2891.gif?updatedAt=1793098614769"
    class="bottom-gif"
    alt=""
    aria-hidden="true"
>

</body>

</html>
