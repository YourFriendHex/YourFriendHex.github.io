<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Character encoding -->
    <meta charset="UTF-8">

    <!-- Makes the page work properly on phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Text shown in the browser tab -->
    <title>Socials</title>

    <!-- Connect our CSS file -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Page header -->
    <header>

        <h1>Socials</h1>

        <p>Support the Community!</p>

    </header>

    <main>

        <!-- Link back to the main list -->
        <a href="index.html" class="back-button">← Back to List</a>

        <!-- Information about the list -->
        <div class="level-page">

            <h2>Reesee</h2>

            <p>
             <a href="https://www.youtube.com/@ReeseeYT" class="small-tab">YouTube</a>
                
            <br><br><a href="discord.gg/WGHmZUVvfK" class ="small-tab">Discord</a>
            </p>

            
          
        </div>

    </main>
<img
    src="https://ik.imagekit.io/2p4y4oqkx/IMG_2890.gif?updatedAt=1793098107416"
    class="bottom-gif"
    alt=""
    aria-hidden="true"
>
    <script src="themes.js"></script>

    <button
    id="theme-menu-button"
    class="theme-menu-button"
    type="button"
    aria-controls="theme-drawer"
    aria-expanded="false"
>
    ☼ Themes
</button>

<div id="theme-overlay" class="theme-overlay"></div>

<aside
    id="theme-drawer"
    class="theme-drawer"
    aria-label="Website themes"
    aria-hidden="true"
>
    <div class="theme-drawer-header">
        <h2>Website Themes</h2>
        <button
            id="theme-close-button"
            class="theme-close-button"
            type="button"
            aria-label="Close theme menu"
        >
            ×
        </button>
    </div>

    <p>Choose how the website looks.</p>

    <div class="theme-options">
        <button class="theme-option" type="button" data-theme-choice="default">
            <span class="theme-preview default-preview"></span>
            <span>Default</span>
        </button>

        <button class="theme-option" type="button" data-theme-choice="dark">
            <span class="theme-preview dark-preview"></span>
            <span>Dark + Red</span>
        </button>
    </div>
</aside>

    <script src="themes.js"></script>
</body>

</html>
