
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bounty Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Bounty Board</h1>
        <p>Find levels that need creators, verifiers, and feedback.</p>
    </header>

    <main>
        <a href="index.html" class="back-button">← Back to List</a>

        <div class="bounty-grid">

            <section class="bounty-section">
                <h2>Collabs</h2>
                <div id="collab-list" class="bounty-list"></div>
            </section>

            <section class="bounty-section">
                <h2>Verifications</h2>
                <div id="verification-list" class="bounty-list"></div>
            </section>

            <section class="bounty-section">
                <h2>Unranked Levels</h2>
                <div id="unranked-list" class="bounty-list"></div>
            </section>

        </div>
    </main>

    
<div id="bounty-modal" class="bounty-modal" aria-hidden="true">

    <div class="bounty-modal-content" role="dialog" aria-modal="true" aria-labelledby="modal-level-name">

        <button id="bounty-modal-close" class="bounty-modal-close" aria-label="Close pop-up">
            &times;
        </button>

        <img id="modal-thumbnail" class="bounty-modal-thumbnail" src="" alt="Level thumbnail">

        <div class="bounty-modal-info">

            <h2 id="modal-level-name">Level Name</h2>

            <p class="bounty-modal-creator">
                Created by <span id="modal-creator"></span>
            </p>

            <div class="bounty-modal-detail">
                <h3>Description</h3>
                <p id="modal-description"></p>
            </div>

            <div class="bounty-modal-detail">
                <h3>What's Needed</h3>
                <p id="modal-needs"></p>
            </div>

            <div class="bounty-modal-footer">
                <p>Status: <span id="modal-status"></span></p>
                <p>Contact: <span id="modal-contact"></span></p>
            </div>

        </div>

    </div>

</div>


    <img
    src="https://ik.imagekit.io/2p4y4oqkx/IMG_2891.gif?updatedAt=1793098614769"
    class="bottom-gif"
    alt=""
    aria-hidden="true"
>

    <button
    id="theme-menu-button"
    class="theme-menu-button"
    type="button"
    aria-controls="theme-drawer"
    aria-expanded="false"
>
    ☼ Themes
</button>

<div id="theme-overlay" class="theme-overlay"></div>

<aside
    id="theme-drawer"
    class="theme-drawer"
    aria-label="Website themes"
    aria-hidden="true"
>
    <div class="theme-drawer-header">
        <h2>Website Themes</h2>
        <button
            id="theme-close-button"
            class="theme-close-button"
            type="button"
            aria-label="Close theme menu"
        >
            ×
        </button>
    </div>

    <p>Choose how the website looks.</p>

    <div class="theme-options">
        <button class="theme-option" type="button" data-theme-choice="default">
            <span class="theme-preview default-preview"></span>
            <span>Default</span>
        </button>

        <button class="theme-option" type="button" data-theme-choice="dark">
            <span class="theme-preview dark-preview"></span>
            <span>Dark + Red</span>
        </button>
    </div>
</aside>

    <script src="themes.js"></script>
    <script src="sheets.js"></script>
    <script src="bounties.js"></script>
</body>
</html>
